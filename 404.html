<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada â€” Apart Nereidas</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --azul-mar: #1B2F7A;
      --turquesa: #2FB6C4;
      --arena: #F3ECDD;
      --arena-light: #FAF7F2;
      --negro: #1A1A1A;
      --gris-medio: #606770;
      --blanco: #FFFFFF;
      --font-script: 'Alex Brush', cursive;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', -apple-system, sans-serif;
      --shadow-md: 0 8px 24px rgba(27, 47, 122, 0.08);
      --shadow-lg: 0 16px 40px rgba(27, 47, 122, 0.14);
      --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--arena-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Fondo decorativo ondas */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(47, 182, 196, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(27, 47, 122, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(243, 236, 221, 0.4) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .error-card {
      position: relative;
      z-index: 1;
      background: var(--blanco);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      padding: 3.5rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      border-top: 4px solid var(--turquesa);
    }

    /* Número de error grande */
    .error-number {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 600;
      color: var(--azul-mar);
      line-height: 1;
      opacity: 0.12;
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }

    .error-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, rgba(47, 182, 196, 0.12), rgba(27, 47, 122, 0.06));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-icon svg {
      width: 36px;
      height: 36px;
      stroke: var(--turquesa);
    }

    .error-brand {
      font-family: var(--font-script);
      font-size: 1.4rem;
      color: var(--turquesa);
      margin-bottom: 0.25rem;
      display: block;
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 600;
      color: var(--azul-mar);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .error-code-badge {
      display: inline-block;
      background: rgba(27, 47, 122, 0.07);
      color: var(--azul-mar);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .error-desc {
      font-family: var(--font-sans);
      font-size: 0.93rem;
      color: var(--gris-medio);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .error-actions {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--azul-mar), #2443a8);
      color: var(--blanco);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 16px rgba(27, 47, 122, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(27, 47, 122, 0.35);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--azul-mar);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      border: 1.5px solid rgba(27, 47, 122, 0.25);
      transition: var(--transition-smooth);
    }
    .btn-secondary:hover {
      border-color: var(--turquesa);
      color: var(--turquesa);
      transform: translateY(-2px);
    }

    .error-footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(0,0,0,0.06);
      font-size: 0.78rem;
      color: var(--gris-medio);
    }
    .error-footer a {
      color: var(--turquesa);
      text-decoration: none;
      font-weight: 600;
    }
    .error-footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .error-card { padding: 2.5rem 1.5rem; }
      .error-actions { flex-direction: column; }
      .btn-primary, .btn-secondary { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-number" aria-hidden="true">404</div>

    <div class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
        <path d="M11 8v4M11 16h.01"/>
      </svg>
    </div>

    <span class="error-brand">Apart Nereidas</span>
    <div class="error-code-badge">Error 404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">
      La página que buscás no existe o fue movida.<br>
      Quizás el enlace está desactualizado o escribiste la dirección incorrectamente.
    </p>

    <div class="error-actions">
      <a href="/" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Volver al inicio
      </a>
      <a href="https://wa.me/5492255415282" class="btn-secondary" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.4 2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Contactar
      </a>
    </div>

    <div class="error-footer">
      Mar de las Pampas, Buenos Aires &nbsp;·&nbsp;
      <a href="tel:+5492255415282">+54 9 2255 45-8000</a>
    </div>
  </div>
</body>
</html>
